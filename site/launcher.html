<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>[hidden]{display:none!important}</style>
<title>Void Launcher</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: horizontal top-nav app shell with a first-run setup screen; content below is a centered column. Wide list-style pack rows, mod cards in browse. Committed dark theme (a game launcher's world). */
:root {
	--bg: #07040f;
	--surface: #0e0a1b;
	--surface-2: #160d2a;
	--card: #130c24;
	--card-hover: #1b1132;
	--line: #271641;
	--line-bright: #44237a;
	--purple: #8b5cf6;
	--purple-bright: #a78bfa;
	--purple-dim: #6d28d9;
	--purple-glow: rgba(139, 92, 246, 0.35);
	--text: #f3f0fb;
	--muted: #b2aac8;
	--faint: #726889;
	--good: #4ade80;
	--warn: #fbbf24;
	--display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
	--body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
	--mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
	color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
	margin: 0; background: var(--bg); color: var(--text); font-family: var(--body);
	font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
body::before {
	content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
	background:
		radial-gradient(820px 460px at 80% -14%, rgba(139,92,246,0.18), transparent 62%),
		radial-gradient(680px 460px at -10% 112%, rgba(109,40,217,0.14), transparent 60%);
}

/* ---- Top nav ---- */
.topnav {
	position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
	background: rgba(10,6,20,0.82); backdrop-filter: blur(12px);
	border-bottom: 1px solid var(--line);
}
body::after { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: #0a0614; z-index: 21; }
.topnav-inner {
	max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 20px;
	padding: 12px max(16px, env(safe-area-inset-left, 0px)); min-height: 60px;
}
.brand { display: flex; align-items: center; gap: 11px; flex: none; }
.brand .mark {
	width: 36px; height: 36px; border-radius: 10px; flex: none; display: grid; place-items: center;
	background: radial-gradient(circle at 50% 38%, #1d1138, #07040f); border: 1px solid var(--line-bright);
	box-shadow: 0 0 20px -6px var(--purple-glow);
}
.brand .mark span { font-family: var(--display); font-weight: 700; font-size: 19px; color: var(--purple-bright); }
.brand b { font-family: var(--display); font-weight: 700; letter-spacing: 0.14em; font-size: 15px; }

.tabs { display: flex; gap: 4px; }
.tab {
	display: inline-flex; align-items: center; gap: 8px; padding: 9px 15px; border-radius: 9px;
	background: none; border: 1px solid transparent; color: var(--muted); font-family: var(--body);
	font-size: 14.5px; font-weight: 500; cursor: pointer; transition: all 0.13s;
}
.tab svg { width: 18px; height: 18px; }
.tab:hover { color: var(--text); background: var(--card); }
.tab.active { color: var(--text); background: linear-gradient(100deg, rgba(139,92,246,0.22), rgba(139,92,246,0.05)); border-color: var(--line-bright); }
.tab.active svg { color: var(--purple-bright); }

.nav-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.runpill {
	display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px;
	background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); font-size: 12.5px;
	cursor: pointer; transition: all 0.13s; white-space: nowrap;
}
.runpill:hover { border-color: var(--line-bright); color: var(--text); }
.runpill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); flex: none; }
.avatar { width: 34px; height: 34px; border-radius: 9px; flex: none; background: linear-gradient(135deg, var(--purple), var(--purple-dim)); display: grid; place-items: center; font-family: var(--display); font-weight: 700; color: #fff; font-size: 15px; }

/* ---- Page ---- */
.page { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: 26px max(16px, env(safe-area-inset-left, 0px)) 48px; }

.section-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
.section-head h2 { font-family: var(--display); font-weight: 600; font-size: 20px; margin: 0; letter-spacing: 0.02em; }
.section-head .sub { color: var(--muted); font-size: 13.5px; }

.btn {
	display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 10px;
	font-family: var(--body); font-size: 14px; font-weight: 600; border: 1px solid transparent; cursor: pointer; white-space: nowrap;
	transition: background 0.14s, transform 0.1s, border-color 0.14s;
}
.btn svg { width: 17px; height: 17px; }
.btn-primary { background: var(--purple); color: #fff; box-shadow: 0 8px 22px -10px var(--purple-glow); }
.btn-primary:hover { background: var(--purple-bright); }
.btn-primary:active { transform: translateY(1px); }
.btn-ghost { background: var(--surface-2); color: var(--text); border-color: var(--line); }
.btn-ghost:hover { background: var(--card-hover); border-color: var(--line-bright); }
.btn-small { padding: 7px 13px; font-size: 13px; border-radius: 8px; }

.chip { font-family: var(--mono); font-size: 11.5px; padding: 3px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); }
.chip.loader { color: var(--purple-bright); border-color: var(--line-bright); }

/* ---- Pack rows (wide list) ---- */
.pack-list { display: flex; flex-direction: column; gap: 13px; }
.pack {
	display: grid; grid-template-columns: 92px 1fr auto; gap: 18px; align-items: center;
	border: 1px solid var(--line); border-radius: 14px; background: var(--card); padding: 14px; cursor: pointer;
	transition: border-color 0.15s, background 0.15s, transform 0.1s;
}
.pack:hover { border-color: var(--line-bright); background: var(--card-hover); transform: translateY(-1px); }
.pack .cover { width: 92px; height: 92px; border-radius: 12px; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 40px; color: #fff; flex: none; border: 1px solid rgba(255,255,255,0.08); }
.pack .pinfo { min-width: 0; }
.pack .pinfo h3 { margin: 0 0 7px; font-size: 17px; font-weight: 600; }
.pack .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.pack .count { color: var(--faint); font-size: 13px; }
.pack .pacts { display: flex; flex-direction: column; gap: 8px; }
.pack .pacts .btn { min-width: 104px; }

.new-row {
	display: flex; align-items: center; gap: 14px; justify-content: center; text-align: center;
	border: 1px dashed var(--line-bright); border-radius: 14px; background: transparent; color: var(--muted);
	padding: 18px; cursor: pointer; transition: all 0.14s; width: 100%; font-family: var(--body);
}
.new-row:hover { color: var(--text); background: var(--card); }
.new-row .plus { width: 40px; height: 40px; border-radius: 11px; border: 1px solid var(--line-bright); display: grid; place-items: center; flex: none; }
.new-row .plus svg { width: 22px; height: 22px; color: var(--purple-bright); }

/* ---- Browse (mod card grid) ---- */
.toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
.search { flex: 1; min-width: 200px; display: flex; align-items: center; gap: 9px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 13px; }
.search svg { width: 17px; height: 17px; color: var(--faint); flex: none; }
.search input { border: 0; background: transparent; color: var(--text); font-family: var(--body); font-size: 14px; width: 100%; outline: none; }
.search input::placeholder { color: var(--faint); }
.pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); font-size: 12.5px; font-weight: 500; cursor: pointer; transition: all 0.13s; }
.pill:hover { border-color: var(--line-bright); color: var(--text); }
.pill.on { background: rgba(139,92,246,0.16); border-color: var(--purple-dim); color: var(--purple-bright); }

.mod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.mod {
	border: 1px solid var(--line); border-radius: 13px; background: var(--card); padding: 15px;
	display: flex; flex-direction: column; gap: 11px; transition: border-color 0.14s, background 0.14s;
}
.mod:hover { border-color: var(--line-bright); background: var(--card-hover); }
.mod .top { display: flex; gap: 12px; align-items: center; }
.mod .ic { width: 48px; height: 48px; border-radius: 11px; display: grid; place-items: center; flex: none; font-family: var(--display); font-weight: 700; font-size: 19px; color: #fff; border: 1px solid rgba(255,255,255,0.08); }
.mod .top .nm { min-width: 0; }
.mod .top h3 { margin: 0; font-size: 15.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mod .top .by { color: var(--faint); font-size: 12px; }
.mod p { margin: 0; color: var(--muted); font-size: 13.5px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-height: 2.7em; }
.mod .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; }
.mod .compat { font-size: 11px; font-family: var(--mono); color: var(--good); }
.mod .addbtn.added { background: var(--surface-2); color: var(--good); border-color: var(--line-bright); cursor: default; }
.mod .tagrow { display: flex; gap: 8px; color: var(--faint); font-size: 11.5px; }

/* ---- Detail ---- */
.back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; color: var(--muted); cursor: pointer; font-family: var(--body); font-size: 13.5px; padding: 0; margin-bottom: 16px; }
.back:hover { color: var(--text); }
.back svg { width: 16px; height: 16px; }
.detail-hero { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 16px; padding: 22px; margin-bottom: 22px; background: linear-gradient(120deg, rgba(76,29,149,0.22), var(--card)); }
.detail-hero .big { width: 84px; height: 84px; border-radius: 18px; flex: none; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 38px; color: #fff; border: 1px solid var(--line-bright); }
.detail-hero .meta2 { flex: 1; min-width: 200px; }
.detail-hero h2 { font-family: var(--display); font-size: 24px; margin: 0 0 8px; font-weight: 700; }
.detail-hero .acts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.stat-row { display: flex; gap: 10px; flex-wrap: wrap; }
.stat { text-align: center; padding: 10px 16px; border-radius: 11px; background: rgba(0,0,0,0.25); border: 1px solid var(--line); }
.stat b { display: block; font-family: var(--display); font-size: 19px; color: var(--purple-bright); }
.stat small { color: var(--faint); font-size: 11px; letter-spacing: 0.05em; }
.dmod { display: grid; grid-template-columns: 44px 1fr auto; gap: 13px; align-items: center; border: 1px solid var(--line); border-radius: 11px; background: var(--card); padding: 11px 14px; }
.dmod .ic { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 17px; color: #fff; }
.dmod h3 { margin: 0; font-size: 14.5px; font-weight: 600; }
.dmod .by { color: var(--faint); font-size: 12px; }

/* ---- First-run + modal ---- */
.scrim { position: fixed; inset: 0; background: rgba(4,2,9,0.82); backdrop-filter: blur(6px); z-index: 50; display: grid; place-items: center; padding: 20px; overflow: auto; }
.setup { width: min(640px, 100%); background: var(--surface); border: 1px solid var(--line-bright); border-radius: 20px; padding: 30px; box-shadow: 0 50px 100px -30px #000; animation: pop 0.18s ease-out; }
@keyframes pop { from { transform: scale(0.97); opacity: 0; } }
.setup .mark-lg { width: 56px; height: 56px; border-radius: 15px; display: grid; place-items: center; background: radial-gradient(circle at 50% 38%, #1d1138, #07040f); border: 1px solid var(--line-bright); margin-bottom: 16px; box-shadow: 0 0 26px -6px var(--purple-glow); }
.setup .mark-lg span { font-family: var(--display); font-weight: 700; font-size: 28px; color: var(--purple-bright); }
.setup h2 { font-family: var(--display); font-size: 25px; margin: 0 0 6px; }
.setup .lead { color: var(--muted); font-size: 14.5px; margin: 0 0 22px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.choice {
	text-align: left; border: 1.5px solid var(--line); border-radius: 14px; background: var(--card); padding: 18px;
	cursor: pointer; transition: all 0.15s; position: relative; display: flex; flex-direction: column; gap: 9px;
}
.choice:hover { border-color: var(--line-bright); background: var(--card-hover); }
.choice.sel { border-color: var(--purple); background: linear-gradient(135deg, rgba(139,92,246,0.14), var(--card)); box-shadow: 0 0 0 1px var(--purple) inset; }
.choice .ic2 { width: 40px; height: 40px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line-bright); display: grid; place-items: center; }
.choice .ic2 svg { width: 21px; height: 21px; color: var(--purple-bright); }
.choice h3 { margin: 0; font-size: 15.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.choice .rec { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; color: var(--good); border: 1px solid var(--line-bright); border-radius: 5px; padding: 2px 6px; }
.choice p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
.choice .check { position: absolute; top: 14px; right: 14px; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line-bright); display: grid; place-items: center; }
.choice.sel .check { background: var(--purple); border-color: var(--purple); }
.choice.sel .check svg { width: 13px; height: 13px; color: #fff; }
.choice:not(.sel) .check svg { display: none; }
.setup .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 24px; gap: 12px; flex-wrap: wrap; }
.setup .foot small { color: var(--faint); font-size: 12.5px; }

.modal { width: min(440px, 100%); background: var(--surface); border: 1px solid var(--line-bright); border-radius: 16px; padding: 24px; box-shadow: 0 40px 80px -30px #000; animation: pop 0.16s ease-out; }
.modal h2 { font-family: var(--display); font-size: 20px; margin: 0 0 4px; }
.modal .lead { color: var(--muted); font-size: 13.5px; margin: 0 0 18px; }
.field { margin-bottom: 15px; }
.field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 7px; font-weight: 600; }
.field input, .field select { width: 100%; padding: 10px 12px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text); font-family: var(--body); font-size: 14px; outline: none; }
.field input:focus, .field select:focus { border-color: var(--purple-dim); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hint { display: flex; gap: 9px; align-items: flex-start; font-size: 12.5px; color: var(--muted); background: rgba(139,92,246,0.08); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; }
.hint svg { width: 16px; height: 16px; color: var(--purple-bright); flex: none; margin-top: 1px; }
.modal-acts { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

.toast-wrap { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 9px; background: var(--surface-2); border: 1px solid var(--line-bright); color: var(--text); padding: 11px 16px; border-radius: 10px; font-size: 13.5px; box-shadow: 0 16px 40px -16px #000; animation: rise 0.2s ease-out; }
.toast svg { width: 17px; height: 17px; color: var(--good); }
@keyframes rise { from { transform: translateY(10px); opacity: 0; } }
.footnote { margin-top: 28px; color: var(--faint); font-size: 12px; text-align: center; }

.brand .mark { background: none; border: 0; box-shadow: 0 0 18px -4px var(--purple-glow); }
.brand .mark img { width: 34px; height: 34px; display: block; }
.setup .mark-lg { background: none; border: 0; }
.setup .mark-lg img { width: 54px; height: 54px; display: block; }
.mod .ic, .dmod .ic { overflow: hidden; padding: 0; }
.mod .ic img, .dmod .ic img { width: 100%; height: 100%; display: block; object-fit: cover; }
.pack .cover { overflow: hidden; padding: 0; }
.pack .cover img { width: 100%; height: 100%; object-fit: cover; object-position: left center; display: block; }
.detail-hero .big { overflow: hidden; padding: 0; }
.detail-hero .big img { width: 100%; height: 100%; object-fit: cover; object-position: left center; display: block; }
.cover-pick { display: flex; gap: 12px; align-items: center; }
.cover-prev { width: 76px; height: 48px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line-bright); flex: none; background: var(--surface-2); }
.cover-prev img { width: 100%; height: 100%; object-fit: cover; object-position: left center; display: block; }

@media (max-width: 680px) {
	.topnav-inner { flex-wrap: wrap; gap: 12px; }
	.tabs { order: 3; width: 100%; }
	.tab { flex: 1; justify-content: center; }
	.tab span { display: none; }
	.nav-right { margin-left: auto; }
	.runpill span.lbl { display: none; }
	.pack { grid-template-columns: 64px 1fr; }
	.pack .cover { width: 64px; height: 64px; font-size: 28px; }
	.pack .pacts { grid-column: 1 / -1; flex-direction: row; }
	.pack .pacts .btn { flex: 1; }
	.choices { grid-template-columns: 1fr; }
	.setup { padding: 22px; }
}
</style>

</head>

function modIcon(m) { const s = MOD_ICONS[m.id]; return s ? `<div class="ic"><img src="${s}" alt=""></div>` : `<div class="ic" style="background:${m.color}">${m.glyph}</div>`; }
const byId = id => MODS.find(m => m.id === id);
let packs = [
	{ id:1, name:"Void FPS Boost", glyph:"V", color:"linear-gradient(135deg,#8b5cf6,#4c1d95)", mc:MC, loader:LOADER, ram:"3 GB", mods:["sodium","lithium","ferritecore","immediatelyfast","entityculling","dynamicfps","voicechat","clothconfig"] },
	{ id:2, name:"Shaders & Pretty", glyph:"S", color:"linear-gradient(135deg,#3949ab,#1a237e)", mc:MC, loader:LOADER, ram:"4 GB", mods:["sodium","iris","ferritecore","modmenu","clothconfig"] },
	{ id:3, name:"Vanilla+ Survival", glyph:"V", color:"linear-gradient(135deg,#00897b,#004d40)", mc:MC, loader:LOADER, ram:"3 GB", mods:["sodium","lithium","jei","xaeros","modmenu","clothconfig"] },
];
function coverHTML(p){ return `<div class="cover"><img src="${p.cover || DEFAULT_COVER}" alt=""></div>`; }
let nextId = 4, currentPack = null, runMode = "Minecraft Launcher";

const $ = s => document.querySelector(s);
const el = (t, c) => { const e = document.createElement(t); if (c) e.className = c; return e; };

/* Nav */
function show(view) {
	["packs","browse","detail"].forEach(v => $("#view-" + v).hidden = (v !== view));
	document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.view === view));
}
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
	if (t.dataset.view === "browse") renderBrowse(null);
	show(t.dataset.view);
}));

/* Packs */
function renderPacks() {
	const list = $("#packList"); list.innerHTML = "";
	packs.forEach(p => {
		const row = el("div", "pack");
		row.innerHTML = `
			${coverHTML(p)}
			<div class="pinfo">
				<h3>${p.name}</h3>
				<div class="meta"><span class="chip">MC ${p.mc}</span><span class="chip loader">${p.loader}</span></div>
				<div class="count">${p.mods.length} mods · ${p.ram} RAM</div>
			</div>
			<div class="pacts">
				<button class="btn btn-primary btn-small play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Play</button>
				<button class="btn btn-ghost btn-small edit">Edit</button>
			</div>`;
		row.querySelector(".play").addEventListener("click", e => { e.stopPropagation(); toast("Launching " + p.name + "…"); });
		row.querySelector(".edit").addEventListener("click", e => { e.stopPropagation(); openPack(p.id); });
		row.addEventListener("click", () => openPack(p.id));
		list.appendChild(row);
	});
	$("#packSub").textContent = packs.length + " packs · runs via " + runMode;
}

/* Detail */
function openPack(id) {
	currentPack = packs.find(p => p.id === id);
	$("#detailName").textContent = currentPack.name;
	$("#detailGlyph").innerHTML = `<img src="${currentPack.cover || DEFAULT_COVER}" alt="">`;
	$("#detailMc").textContent = "MC " + currentPack.mc;
	$("#detailLoader").textContent = currentPack.loader;
	$("#detailModCount").textContent = currentPack.mods.length;
	$("#detailRam").textContent = currentPack.ram;
	renderDetailList();
	show("detail");
}
function renderDetailList() {
	const list = $("#detailList"); list.innerHTML = "";
	currentPack.mods.map(byId).forEach(m => {
		const row = el("div", "dmod");
		row.innerHTML = `${modIcon(m)}
			<div class="nm"><h3>${m.name}</h3><div class="by">${m.cat} · by ${m.by}</div></div>
			<button class="btn btn-ghost btn-small rm">Remove</button>`;
		row.querySelector(".rm").addEventListener("click", () => {
			currentPack.mods = currentPack.mods.filter(x => x !== m.id);
			$("#detailModCount").textContent = currentPack.mods.length;
			renderDetailList(); toast(m.name + " removed");
		});
		list.appendChild(row);
	});
}
$("#detailBack").addEventListener("click", () => { renderPacks(); show("packs"); });
$("#detailAddMods").addEventListener("click", () => { renderBrowse(currentPack.id); show("browse"); });
$("#detailCover").addEventListener("click", () => $("#detailCoverFile").click());
$("#detailCoverFile").addEventListener("change", e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { currentPack.cover = r.result; $("#detailGlyph").innerHTML = `<img src="${r.result}" alt="">`; renderPacks(); toast("Cover updated"); }; r.readAsDataURL(f); });

/* Browse */
const CATS = ["All","Performance","Visual","Utility","Social","Library"];
let activeCat = "All";
function renderBrowse(packId) {
	const pack = packId ? packs.find(p => p.id === packId) : null;
	$("#browseHeading").textContent = pack ? ("Add mods to " + pack.name) : "Browse Mods";
	$("#browseSub").textContent = "Modrinth · " + (pack ? pack.loader : LOADER) + " · Minecraft " + (pack ? pack.mc : MC);
	const pills = $("#pills"); pills.innerHTML = "";
	CATS.forEach(c => { const b = el("button", "pill" + (c === activeCat ? " on" : "")); b.textContent = c; b.addEventListener("click", () => { activeCat = c; renderBrowse(packId); }); pills.appendChild(b); });
	const grid = $("#browseGrid"); grid.innerHTML = "";
	MODS.filter(m => activeCat === "All" || m.cat === activeCat).forEach(m => {
		const inPack = pack && pack.mods.includes(m.id);
		const card = el("div", "mod");
		card.innerHTML = `
			<div class="top">
				${modIcon(m)}
				<div class="nm"><h3>${m.name}</h3><div class="by">by ${m.by}</div></div>
			</div>
			<p>${m.desc}</p>
			<div class="tagrow"><span>${m.cat}</span><span>⬇ ${m.dl}</span></div>
			<div class="foot">
				<span class="compat">✓ ${MC} · ${LOADER}</span>
				${inPack
					? `<button class="btn btn-small addbtn added"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="m20 6-11 11-5-5"/></svg>Added</button>`
					: `<button class="btn btn-primary btn-small addbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add</button>`}
			</div>`;
		if (!inPack) card.querySelector(".addbtn").addEventListener("click", () => {
			if (pack) { pack.mods.push(m.id); toast(m.name + " added to " + pack.name); renderBrowse(pack.id); }
			else toast(m.name + " — open a pack to add it");
		});
		grid.appendChild(card);
	});
}
$("#searchInput").addEventListener("keydown", e => { if (e.key === "Enter") toast('Searching Modrinth for "' + e.target.value + '"…'); });

			<h2>${firstRun ? "Welcome to Void Launcher" : "How Void runs Minecraft"}</h2>
			<p class="lead">Choose how Void should run the game. You can change this anytime.</p>
			<div class="choices">
				<button class="choice" data-mode="Minecraft Launcher">
					<span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m20 6-11 11-5-5"/></svg></span>
					<div class="ic2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg></div>
					<h3>Minecraft Launcher <span class="rec">DEFAULT</span></h3>
					<p>Void adds your packs to the official Minecraft Launcher you already use. Nothing extra to install.</p>
				</button>
				<button class="choice" data-mode="Standalone">
					<span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m20 6-11 11-5-5"/></svg></span>
					<div class="ic2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5v14l11-7z"/></svg></div>
					<h3>Standalone</h3>
					<p>Void downloads and runs Minecraft itself, like CurseForge. One app for everything.</p>
				</button>
			</div>
			<div class="foot">
				<small>${firstRun ? "You can switch anytime from the top bar." : "Changing this won't affect packs you've already made."}</small>
				<button class="btn btn-primary" id="setup-go">${firstRun ? "Continue" : "Save"}</button>
			</div>
		</div>`;
	document.body.appendChild(scrim);
	const sync = () => scrim.querySelectorAll(".choice").forEach(c => c.classList.toggle("sel", c.dataset.mode === pick));
	sync();
	scrim.querySelectorAll(".choice").forEach(c => c.addEventListener("click", () => { pick = c.dataset.mode; sync(); }));
	if (!firstRun) scrim.addEventListener("click", e => { if (e.target === scrim) scrim.remove(); });
	scrim.querySelector("#setup-go").addEventListener("click", () => {
		runMode = pick; $("#runMode").textContent = runMode; renderPacks();
		scrim.remove();
		toast(firstRun ? "Set up — running via " + runMode : "Now running via " + runMode);
	});
}
$("#runPill").addEventListener("click", () => openRunChooser(false));

/* Shared modal mount */
function mountScrim(scrim) {
	document.body.appendChild(scrim);
	scrim.addEventListener("click", e => { if (e.target === scrim) scrim.remove(); });
	scrim.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => scrim.remove()));
}

/* Toast */
function toast(msg) {
	const t = el("div", "toast");
	t.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m20 6-11 11-5-5"/></svg><span>${msg}</span>`;
	$("#toastWrap").appendChild(t);
	setTimeout(() => { t.style.transition = "opacity .3s, transform .3s"; t.style.opacity = "0"; t.style.transform = "translateY(8px)"; setTimeout(() => t.remove(), 300); }, 1900);
}

renderPacks();
openRunChooser(true);
</script>
