name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
      - name: make scripts executable
        run: chmod +x ./gradlew tools/build-site.sh
      - name: build mod, modpack, installer and site
        run: tools/build-site.sh
      - name: test installer
        run: |
          mkdir -p "$RUNNER_TEMP/mc/.minecraft"
          echo '{"profiles":{},"version":3}' > "$RUNNER_TEMP/mc/.minecraft/launcher_profiles.json"
          cd installer && go run . -silent -minecraft-dir "$RUNNER_TEMP/mc/.minecraft" -game-dir "$RUNNER_TEMP/mc/.voidclient"
          test -f "$RUNNER_TEMP/mc/.voidclient/mods/voidclient-$(grep '^version=' ../gradle.properties | cut -d= -f2).jar"
      - name: test launcher
        run: cd launcher && go test ./...
      - name: upload site
        uses: actions/upload-artifact@v7
        with:
          name: VoidClient-site
          path: site/
